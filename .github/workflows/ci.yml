name: TraceSearch CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # setup-uv owns the single project .venv; do not create it a second time.
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest
      - run: uv run python -m tracesearch.cli.run_m0 --output runs/ci-smoke
      - run: uv run python -m tracesearch.cli.run_m1_train --help
