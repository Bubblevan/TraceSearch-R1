name: TraceSearch CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run M0 CLI smoke
        run: python -m tracesearch.cli.run_m0 --output runs/ci-smoke
      - name: Run M1 Level-A CLI smoke
        run: python -m tracesearch.cli.run_m1_eval --help
      - name: Check M1 Level-B CLI boundaries
        run: |
          python -m tracesearch.cli.run_m1_rollout --help
          python -m tracesearch.cli.prepare_m1_data --help
