name: TraceSearch CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv venv --python 3.11
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: uv run --python .venv/bin/python pytest
      - run: uv run --python .venv/bin/python -m tracesearch.cli.run_m0 --output runs/ci-smoke
      - run: uv run --python .venv/bin/python -m tracesearch.cli.run_m1_train --help
