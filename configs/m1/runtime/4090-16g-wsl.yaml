# Frozen hardware-specific M1-C1 profile.
# Validated on the current 16-GiB single-GPU WSL2 setup.
profile_name: 4090-16g-wsl
validation_label: "validated on the current 16-GiB single-GPU WSL2 setup"

runtime:
  rollout_engine: vllm
  gpu_memory_utilization: 0.9
  cpu_offload_gb: 0
  enforce_eager: false
  tensor_model_parallel_size: 1
  max_model_len: 1024
  # C1.2 controlled context budget: 896 + 96 leaves a 32-token reserve.
  max_prompt_length: 896
  max_num_batched_tokens: 4096

model:
  name: Qwen2.5-3B-Instruct
  lora_rank: 8
  lora_alpha: 16
  lora_merge: true
  attention_implementation: sdpa
  gradient_checkpointing: true

training:
  algorithm: grpo
  learning_rate: 1.0e-6
  weight_decay: 0.0
  ppo_epochs: 1
  kl_beta: 0.0
  rejection_sampling: false
  stepwise_advantage: false
  process_reward: false
  loss_agg_mode: seq-mean-token-mean

sampling:
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  presence_penalty: 0.0
  repetition_penalty: 1.0
  disable_thinking: true
